{% extends "templates/web.html" %}

{% block title %}Edit Artwork{% endblock %}

{% block head_include %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false, visibility: false },
    theme: {
      extend: {
        fontFamily: { serif: ['Cormorant Garamond', 'Georgia', 'serif'] },
        colors: { accent: '#c45c26' }
      }
    }
  }
</script>
{% endblock %}

{% block page_content %}
<div class="max-w-xl mx-auto px-4 py-8 pb-16">

  <h1 class="font-semibold text-stone-800 mb-6" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;">Edit Artwork</h1>

  <div class="mb-4">
    <label class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Photo</label>
    <div class="relative border-2 border-dashed border-stone-200 rounded-xl p-6 text-center" id="img-area">
      {% if art.image %}
      <img id="img-preview" class="w-full max-h-60 object-contain rounded-lg mb-2" src="{{ art.image }}">
      <p class="text-stone-400 text-sm mb-3" id="img-hint">Current photo</p>
      {% else %}
      <img id="img-preview" class="w-full max-h-60 object-contain rounded-lg mb-2" style="display:none;">
      <p class="text-stone-400 text-sm mb-3" id="img-hint">No photo yet</p>
      {% endif %}
      <div class="flex gap-2 justify-center flex-wrap">
        <button type="button" id="btn-take-photo"
          class="px-4 py-2.5 border border-stone-300 rounded-lg text-sm font-medium text-stone-700 bg-white cursor-pointer hover:border-stone-700 transition-colors"
          style="min-height:44px;">Take Photo</button>
        <button type="button" id="btn-choose-file"
          class="px-4 py-2.5 border border-stone-300 rounded-lg text-sm font-medium text-stone-700 bg-white cursor-pointer hover:border-stone-700 transition-colors"
          style="min-height:44px;">Choose from Gallery</button>
      </div>
      <input type="file" id="img-input" accept="image/*" class="hidden">
      <input type="file" id="img-input-camera" accept="image/*" capture="environment" class="hidden">
    </div>
  </div>

  <div class="mb-4">
    <label for="f-title" class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Title *</label>
    <input type="text" id="f-title" value="{{ art.title }}"
      class="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-base text-stone-800 bg-white focus:outline-none focus:border-stone-700 transition-colors" style="box-sizing:border-box;">
  </div>

  <div class="mb-4">
    <label for="f-medium" class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Medium</label>
    <input type="text" id="f-medium" value="{{ art.medium or '' }}" placeholder="e.g. Oil on canvas"
      class="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-base text-stone-800 bg-white focus:outline-none focus:border-stone-700 transition-colors" style="box-sizing:border-box;">
  </div>

  <div class="mb-4">
    <label for="f-year" class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Year</label>
    <input type="number" id="f-year" value="{{ art.year or '' }}" min="1900" max="2100"
      class="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-base text-stone-800 bg-white focus:outline-none focus:border-stone-700 transition-colors" style="box-sizing:border-box;">
  </div>

  <div class="mb-4">
    <label for="f-desc" class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Description</label>
    <textarea id="f-desc" rows="3"
      class="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-base text-stone-800 bg-white focus:outline-none focus:border-stone-700 transition-colors resize-y" style="box-sizing:border-box;min-height:80px;">{{ art.description or '' }}</textarea>
  </div>

  <div class="mb-4">
    <div class="flex items-center gap-3" style="min-height:44px;">
      <input type="checkbox" id="f-forsale" {% if art.for_sale %}checked{% endif %} class="w-4 h-4 cursor-pointer accent-stone-800">
      <label for="f-forsale" class="cursor-pointer text-sm text-stone-700 m-0">This piece is for sale</label>
    </div>
  </div>

  <div class="mb-4 {% if not art.for_sale %}hidden{% endif %}" id="price-group">
    <label for="f-price" class="block text-xs font-semibold text-stone-500 mb-1.5 uppercase tracking-wide">Price</label>
    <input type="number" id="f-price" value="{{ art.price or '' }}" min="0" step="1"
      class="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-base text-stone-800 bg-white focus:outline-none focus:border-stone-700 transition-colors" style="box-sizing:border-box;">
  </div>

  <div class="mb-4">
    <div class="flex items-center gap-3" style="min-height:44px;">
      <input type="checkbox" id="f-published" {% if art.is_published %}checked{% endif %} class="w-4 h-4 cursor-pointer accent-stone-800">
      <label for="f-published" class="cursor-pointer text-sm text-stone-700 m-0">Published (visible in gallery)</label>
    </div>
  </div>

  <button id="btn-save"
    class="w-full py-3.5 bg-stone-800 text-white rounded-xl text-base font-semibold cursor-pointer hover:bg-stone-900 transition-colors mt-2"
    style="border:none;min-height:52px;">Save Changes</button>

  <button id="btn-delete"
    class="w-full py-3.5 bg-transparent text-red-600 rounded-xl text-base font-semibold cursor-pointer hover:bg-red-500 hover:text-white transition-all mt-3"
    style="border:1.5px solid #ef4444;min-height:52px;">Delete Artwork</button>

  <div id="status-msg" class="hidden mt-3 px-4 py-2 rounded-lg text-sm text-center"></div>
</div>

<script>
const ARTWORK_NAME = {{ art.name | tojson }};
const imgInput       = document.getElementById('img-input');
const imgInputCamera = document.getElementById('img-input-camera');
const imgPreview     = document.getElementById('img-preview');
const imgHint        = document.getElementById('img-hint');
const btnTakePhoto   = document.getElementById('btn-take-photo');
const btnChooseFile  = document.getElementById('btn-choose-file');
const forSale        = document.getElementById('f-forsale');
const priceGroup     = document.getElementById('price-group');
const btnSave        = document.getElementById('btn-save');
const btnDelete      = document.getElementById('btn-delete');
const statusMsg      = document.getElementById('status-msg');

let selectedFile = null;

btnTakePhoto.addEventListener('click', () => imgInputCamera.click());
btnChooseFile.addEventListener('click', () => imgInput.click());

function handleFileSelect(file) {
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    imgPreview.src = e.target.result;
    imgPreview.style.display = 'block';
    imgHint.textContent = file.name;
  };
  reader.readAsDataURL(file);
}

imgInput.addEventListener('change', () => handleFileSelect(imgInput.files[0]));
imgInputCamera.addEventListener('change', () => handleFileSelect(imgInputCamera.files[0]));

forSale.addEventListener('change', () => {
  priceGroup.classList.toggle('hidden', !forSale.checked);
});

function showStatus(msg, type) {
  if (!msg) { statusMsg.className = 'hidden'; return; }
  statusMsg.textContent = msg;
  statusMsg.className = type === 'error'
    ? 'mt-3 px-4 py-2 rounded-lg text-sm text-center bg-red-50 text-red-700'
    : 'mt-3 px-4 py-2 rounded-lg text-sm text-center bg-green-50 text-green-700';
}

btnSave.addEventListener('click', async () => {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showStatus('Title is required.', 'error'); return; }

  btnSave.disabled = true;
  btnSave.style.opacity = '0.55';
  btnSave.textContent = 'Saving…';
  showStatus('', '');

  try {
    let fileUrl = null;
    if (selectedFile) {
      btnSave.textContent = 'Uploading photo…';
      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('is_private', 0);
      formData.append('optimize', 1);
      const uploadRes = await fetch('/api/method/upload_file', {
        method: 'POST',
        headers: { 'X-Frappe-CSRF-Token': frappe.csrf_token },
        body: formData,
      });
      const uploadData = await uploadRes.json();
      if (!uploadRes.ok || !uploadData.message) throw new Error('Image upload failed.');
      fileUrl = uploadData.message.file_url;
    }

    btnSave.textContent = 'Saving…';
    const payload = {
      title,
      medium: document.getElementById('f-medium').value.trim() || null,
      year: parseInt(document.getElementById('f-year').value) || null,
      description: document.getElementById('f-desc').value.trim() || null,
      for_sale: forSale.checked ? 1 : 0,
      price: forSale.checked ? (parseFloat(document.getElementById('f-price').value) || 0) : 0,
      is_published: document.getElementById('f-published').checked ? 1 : 0,
    };
    if (fileUrl) payload.image = fileUrl;

    const saveRes = await fetch('/api/v2/document/Artwork/' + ARTWORK_NAME, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Frappe-CSRF-Token': frappe.csrf_token,
      },
      body: JSON.stringify(payload),
    });
    const saveData = await saveRes.json();
    if (!saveRes.ok) throw new Error(saveData.exception || 'Save failed.');

    window.location.href = '/manage';
  } catch (err) {
    showStatus(err.message || 'Something went wrong.', 'error');
    btnSave.disabled = false;
    btnSave.style.opacity = '';
    btnSave.textContent = 'Save Changes';
  }
});

btnDelete.addEventListener('click', async () => {
  if (!confirm('Delete this artwork? This cannot be undone.')) return;
  btnDelete.disabled = true;
  btnDelete.style.opacity = '0.55';
  btnDelete.textContent = 'Deleting…';
  try {
    const res = await fetch('/api/v2/document/Artwork/' + ARTWORK_NAME, {
      method: 'DELETE',
      headers: { 'X-Frappe-CSRF-Token': frappe.csrf_token },
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.exception || 'Delete failed.');
    }
    window.location.href = '/manage';
  } catch (err) {
    showStatus(err.message || 'Delete failed.', 'error');
    btnDelete.disabled = false;
    btnDelete.style.opacity = '';
    btnDelete.textContent = 'Delete Artwork';
  }
});
</script>
{% endblock %}
